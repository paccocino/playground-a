<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Startseite · stotz-design</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #8db22f;
    --black: #000000;
    --white: #ffffff;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    color: var(--black);
    font-family: "Open Sans", sans-serif;
    background: url("https://www.stotz-design.com/wp-content/uploads/2020/10/Digital_Campagning_office.jpg") center center / cover no-repeat fixed;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 24px 64px;
  }

  .top-accent {
    width: 100%;
    height: 4px;
    background: var(--green);
  }

  /* ---------- Suche ---------- */

  .search-wrap {
    width: 100%;
    max-width: 560px;
    margin-top: 12vh;
    margin-bottom: 72px;
  }

  .search-form {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    border: 1px solid #e2e2e2;
    padding: 14px 22px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
    transition: box-shadow .25s ease, border-color .25s ease;
  }

  .search-form:focus-within {
    border-color: var(--green);
    box-shadow: 0 4px 20px rgba(141, 178, 47, 0.35);
  }

  .search-form svg {
    flex: none;
    opacity: .45;
  }

  .search-form input[type="text"] {
    flex: 1;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 16px;
    color: var(--black);
    background: transparent;
  }

  .search-form button {
    flex: none;
    border: none;
    background: var(--green);
    color: var(--white);
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    padding: 9px 18px;
    cursor: pointer;
    transition: filter .2s ease;
  }

  .search-form button:hover {
    filter: brightness(0.93);
  }

  /* ---------- Favoriten ---------- */

  .favorites {
    width: 100%;
    max-width: 1200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
  }

  .row-divider {
    width: 100%;
    height: 1px;
    background: #cccccc;
  }

  .fav-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 36px 32px;
  }

  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: var(--black);
    width: 90px;
  }

  .tile-visual {
    position: relative;
    width: 90px;
    height: 90px;
    margin-bottom: 22px;
    transition: transform .35s cubic-bezier(.25,.8,.35,1);
  }

  .tile-visual::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -13px;
    width: 55px;
    height: 9px;
    background: var(--black);
    opacity: .16;
    filter: blur(4px);
    transform: translateX(-50%);
    transition: all .35s cubic-bezier(.25,.8,.35,1);
  }

  .tile:hover .tile-visual,
  .tile:focus-visible .tile-visual {
    transform: translateY(-10px);
  }

  .tile:hover .tile-visual::after,
  .tile:focus-visible .tile-visual::after {
    opacity: .09;
    width: 41px;
    bottom: -9px;
    filter: blur(5px);
  }

  .tile-icon {
    width: 90px;
    height: 90px;
    background: var(--white);
    border: 1px solid #ececec;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }

  .tile-icon img {
    width: 40px;
    height: 40px;
    object-fit: contain;
  }

  .tile-icon .fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--green);
    color: var(--white);
    font-weight: 700;
    font-size: 24px;
  }

  .tile-label {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--white);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.65);
  }

  @media (prefers-color-scheme: dark) {
    html, body {
      background: url("https://www.stotz-design.com/wp-content/uploads/2020/10/Digital_Campagning_office.jpg") center center / cover no-repeat fixed;
    }
  }
</style>
</head>
<body>

<div class="top-accent"></div>

<div class="search-wrap">
  <form class="search-form" action="https://www.google.com/search" method="GET">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M21 21L16.65 16.65M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <input type="text" name="q" autofocus autocomplete="off" placeholder="Google-Suche&hellip;">
    <button type="submit">Suchen</button>
  </form>
</div>

<div class="favorites" id="favorites"></div>

<script>
  // Fallback-Daten: greifen, wenn favorites.json nicht geladen werden kann
  // (z.B. beim Testen als einzelne Datei ohne Webserver).
  var FALLBACK_FAVORITES = [
    [
      { name: "MOCO", url: "https://stotz-design.mocoapp.com/projects", icon: "https://www.google.com/s2/favicons?sz=64&domain=stotz-design.mocoapp.com" },
      { name: "SD CLOUD", url: "https://stotz-design.cloud/index.php/apps/files/files/123?dir=/01-KUNDEN", icon: "https://www.google.com/s2/favicons?sz=64&domain=stotz-design.cloud" }
    ],
    [
      { name: "Conmetallmeister", url: "https://www.conmetallmeister.de/", icon: "https://www.google.com/s2/favicons?sz=64&domain=www.conmetallmeister.de" },
      { name: "Textation Group", url: "https://www.textation-group.com/", icon: "https://www.google.com/s2/favicons?sz=64&domain=www.textation-group.com" },
      { name: "Textation Karriere", url: "https://karriere.textation-group.com/", icon: "https://www.google.com/s2/favicons?sz=64&domain=karriere.textation-group.com" },
      { name: "Jumbo-Textil", url: "https://www.jumbo-textil.de/", icon: "https://www.google.com/s2/favicons?sz=64&domain=www.jumbo-textil.de" },
      { name: "vombaur", url: "https://vombaur.de/", icon: "https://www.google.com/s2/favicons?sz=64&domain=vombaur.de" },
      { name: "Röthel", url: "https://roethel.com/", icon: "https://www.google.com/s2/favicons?sz=64&domain=roethel.com" },
      { name: "Attelmann Architekten", url: "https://attelmann-architekten.de/", icon: "https://www.google.com/s2/favicons?sz=64&domain=attelmann-architekten.de" }
    ]
  ];

  function faviconUrl(pageUrl) {
    var domain = new URL(pageUrl).hostname;
    return "https://www.google.com/s2/favicons?sz=64&domain=" + domain;
  }

  function initials(name) {
    var words = name.trim().split(/\s+/);
    return (words[0][0] + (words[1] ? words[1][0] : "")).toUpperCase();
  }

  function renderFavorites(rows) {
    var container = document.getElementById("favorites");
    container.innerHTML = "";

    rows.forEach(function (row, rowIndex) {
      if (rowIndex > 0) {
        var divider = document.createElement("div");
        divider.className = "row-divider";
        container.appendChild(divider);
      }

      var rowEl = document.createElement("div");
      rowEl.className = "fav-row";

      row.forEach(function (item) {
        var tile = document.createElement("a");
        tile.className = "tile";
        tile.href = item.url;
        tile.target = "_blank";
        tile.rel = "noopener";

        var visual = document.createElement("div");
        visual.className = "tile-visual";

        var icon = document.createElement("div");
        icon.className = "tile-icon";

        var img = document.createElement("img");
        img.src = item.icon || faviconUrl(item.url);
        img.alt = "";
        img.loading = "lazy";
        img.onerror = function () {
          icon.innerHTML = '<div class="fallback">' + initials(item.name) + "</div>";
        };
        icon.appendChild(img);

        var label = document.createElement("div");
        label.className = "tile-label";
        label.textContent = item.name;

        visual.appendChild(icon);
        tile.appendChild(visual);
        tile.appendChild(label);
        rowEl.appendChild(tile);
      });

      container.appendChild(rowEl);
    });
  }

  fetch("favorites.json")
    .then(function (res) {
      if (!res.ok) throw new Error("favorites.json nicht gefunden");
      return res.json();
    })
    .then(renderFavorites)
    .catch(function () {
      renderFavorites(FALLBACK_FAVORITES);
    });
</script>

</body>
</html>
